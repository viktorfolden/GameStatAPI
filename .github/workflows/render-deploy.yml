name: Test and deploy to Render

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Java integration tests and package
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/python/requirements.txt
      - name: Install Python client dependencies
        run: python -m pip install -r examples/python/requirements.txt
      - name: Run Python client tests
        run: python -m unittest discover -s examples/python -p 'test_*.py'
      - name: Build deployment image
        run: docker build --tag game-stat-api:ci .

  deploy:
    name: Request Render deployment
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deploy tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL repository secret first."
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK_URL" != https://api.render.com/deploy/srv-*\?key=* ]]; then
            echo "::error::Expected a Render deploy hook URL copied from the service settings."
            exit 1
          fi
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST --output /dev/null \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"
          echo "Render accepted the deploy request for ${COMMIT_SHA}. Check Render for build and rollout status."
